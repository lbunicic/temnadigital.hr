<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <!-- route-meta:start (replaced per route at build time by the prerender plugin in vite.config.ts) -->
    <title>Lovro Buničić | Senior Software Engineer | Temna Digital</title>
    <meta name="description" content="Senior Software Engineer with over 7 years of experience building high-quality mobile applications for enterprise-scale systems across fintech, healthcare, and telecom industries." />
    <link rel="canonical" href="https://temnadigital.hr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Temna Digital" />
    <meta property="og:title" content="Lovro Buničić | Senior Software Engineer | Temna Digital" />
    <meta property="og:description" content="Senior Software Engineer with over 7 years of experience building high-quality mobile applications for enterprise-scale systems across fintech, healthcare, and telecom industries." />
    <meta property="og:url" content="https://temnadigital.hr/" />
    <meta property="og:image" content="https://temnadigital.hr/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- route-meta:end -->
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
